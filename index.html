<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>詩騷大對決｜蒹葭 × 漁父</title><style>:root{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#f8f0dc;background:#142a30}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#36585b,#142a30 60%);min-height:100vh}main{max-width:1150px;margin:auto;padding:24px}h1{font-size:clamp(30px,5vw,56px);margin:10px 0}h2{font-size:clamp(24px,3vw,36px)}p{line-height:1.6}.muted{color:#d2d5c9}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.panel{background:#ffffff12;border:1px solid #ffffff30;border-radius:20px;padding:24px;margin:18px 0}.btn,.tile{font:inherit;border:1px solid #b9ad85;border-radius:13px;padding:14px 20px;cursor:pointer;background:#f3e8c9;color:#1d3335;font-weight:700}.btn:disabled{opacity:.35;cursor:default}.btn.alt{background:transparent;color:#f4e8c9}.btn:focus-visible,.tile:focus-visible{outline:4px solid #f6c65d}.row{display:flex;gap:12px;flex-wrap:wrap}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{min-height:84px;text-align:left;font-size:clamp(18px,2.3vw,26px)}.tile.selected{background:#f5c96d}.tile.correct{background:#b8edcb}.tile.wrong{background:#f6a9a9}.zones{display:grid;grid-template-columns:1fr 1fr;gap:16px}.zone{min-height:160px;border:3px dashed #d8c9a0;border-radius:18px;padding:20px;text-align:center;font-size:25px;display:grid;place-items:center;gap:8px}.zone.over{background:#ffffff30}.question{font-size:clamp(25px,3vw,38px);font-weight:700;line-height:1.5;margin:18px 0 25px}.answer{font-size:20px;background:#122a2c;padding:20px;border-radius:14px;margin-top:20px}.good{color:#9ef3bd}.bad{color:#ffb1aa}.progress{height:12px;background:#ffffff2b;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#f4c76c;transition:width .3s}.tag{color:#f5c96d;font-weight:700;letter-spacing:2px}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px}.match{display:grid;grid-template-columns:1fr 1fr;gap:18px}.match .tile{text-align:center}.small{font-size:16px}.hidden{display:none}@media(max-width:650px){.choices,.zones,.match{grid-template-columns:1fr}.panel{padding:15px}main{padding:12px}}</style></head><body><main><header class="top"><div><div class="tag">高中國文｜課後互動複習</div><h1>詩騷大對決</h1><div class="muted">〈蒹葭〉×〈漁父〉｜20題・三大關卡</div></div><div id="score" style="font-size:25px">得分 0 / 200</div></header><div class="progress"><div id="bar" style="width:0%"></div></div><section class="panel" id="app"></section></main><script>
const classify=[['中國最早的詩歌總集','詩經'],['以四言詩為主','詩經'],['分為風、雅、頌','詩經'],['賦、比、興為重要表現手法','詩經'],['屈原、宋玉為代表作家','楚辭'],['具有鮮明的楚地文化色彩','楚辭'],['《離騷》《九歌》為代表作品','楚辭'],['句式較參差，常使用「兮」字','楚辭']];
const pairs=[['蒹葭蒼蒼，白露為霜','以秋景起興，營造清冷朦朧的意境'],['所謂伊人，在水一方','追尋的對象遙不可及'],['溯洄從之，道阻且長','追尋過程充滿阻礙'],['舉世皆濁我獨清','屈原堅守自身清白'],['聖人不凝滯於物，而能與世推移','漁父主張順應世情'],['安能以皓皓之白，而蒙世俗之塵埃乎','屈原不願同流合污']];
const quiz=[['〈蒹葭〉反覆出現相似的章句，主要產生什麼效果？',['強化迴環往復的節奏與追尋情感','呈現人物之間的激烈辯論','交代完整的歷史事件','描寫戰爭的發展過程'],0],['〈蒹葭〉中的「伊人」最適合如何理解？',['必然是詩人的妻子','可以是思慕的對象，也保有多元詮釋空間','必然是一位君王','就是詩中的敘事者'],1],['〈漁父〉主要透過哪種寫作方式凸顯人物思想？',['重章疊句','詳細描寫宮廷建築','人物對話與觀點對比','大量描寫神話戰爭'],2],['漁父唱出「滄浪之水清兮，可以濯吾纓」等句，主要呼應哪種處世觀？',['無論環境如何都應積極入仕','以武力改變世道','完全不關心世事','因應世道清濁，靈活調整處世方式'],3],['下列何者最能概括《詩經》與《楚辭》在文學史上的重要特色？',['《詩經》以小說敘事為主，《楚辭》以戲劇為主','《詩經》與寫實傳統關係密切，《楚辭》對浪漫抒情傳統影響深遠','兩者都以五言律詩為主要形式','兩者都沒有對後世文學產生影響'],1],['比較〈蒹葭〉與〈漁父〉，下列何者最恰當？',['兩篇都以人物辯論為主要形式','兩篇都直接描寫戰爭','〈蒹葭〉以景物與反覆吟詠呈現追尋情感；〈漁父〉以對話呈現不同處世觀','兩篇都沒有象徵或言外之意'],2]];
let step=-1,score=0,locked=false,selected=-1;const app=document.getElementById('app');function btn(t,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}function safe(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function render(){document.getElementById('score').textContent=`得分 ${score} / 200`;document.getElementById('bar').style.width=`${Math.max(0,step)/20*100}%`;locked=false;selected=-1;if(step===-1){app.innerHTML=`<h2>準備好成為詩騷鑑定師了嗎？</h2><p>第一關拖曳分類（8題）・第二關左右配對（6題）・第三關四選一（6題）。每題10分，答錯也能看正解。支援觸控、滑鼠與點選操作。</p>${btn('開始挑戰','next()')}`;return}if(step===20){app.innerHTML=`<h2>🎉 挑戰完成！</h2><p class="question">本次得分：${score} / 200</p><p>《詩經》以四言、重章疊句、賦比興等見長；《楚辭》發展鮮明的楚地抒情風格。〈蒹葭〉與〈漁父〉各自展現不同的藝術表現。</p>${btn('重新開始','restart()')}`;return}let title=step<8?'第一關｜詩騷分類王':step<14?'第二關｜經典配對王':'第三關｜文學決勝局';let n=step+1;let html=`<div class="top"><span class="tag">${title}</span><span>第 ${n} / 20 題</span></div>`;if(step<8){html+=`<div class="question">${safe(classify[step][0])}</div><p class="muted">拖曳卡片至正確區域，或直接點選下方分類。</p><div class="row"><button id="drag" class="tile" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','card')" style="width:100%;text-align:center">${safe(classify[step][0])}　☰</button></div><div class="zones" style="margin-top:20px">${['詩經','楚辭'].map(z=>`<button class="zone" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();choose('${z}')" onclick="choose('${z}')">《${z}》<span class="small">拖曳到此／點選</span></button>`).join('')}</div>`}else if(step<14){let j=step-8;let options=[pairs[j][1],pairs[(j+2)%6][1],pairs[(j+4)%6][1]];options=[...new Set(options)];html+=`<div class="question">將左側原文與右側解釋配對</div><div class="match"><div class="tile" style="display:grid;place-items:center">${safe(pairs[j][0])}</div><div class="row" style="flex-direction:column">${options.map((o,i)=>`<button class="tile" onclick="choose(${i})">${safe(o)}</button>`).join('')}</div></div>`}else{let q=quiz[step-14];html+=`<div class="question">${safe(q[0])}</div><div class="choices">${q[1].map((o,i)=>`<button class="tile" onclick="choose(${i})">${'ABCD'[i]}. ${safe(o)}</button>`).join('')}</div>`}html+=`<div id="feedback" aria-live="polite"></div><div class="footer">${btn('重新開始','restart()','alt')}<span id="nextslot"></span></div>`;app.innerHTML=html}
function choose(ans){if(locked)return;locked=true;let correct=step<8?classify[step][1]:step<14?0:quiz[step-14][2];let good=ans===correct;if(good)score+=10;let explanation=step<8?`正確分類：《${correct}》`:step<14?`正確配對：${pairs[step-8][1]}`:`正確答案：${'ABCD'[correct]}. ${quiz[step-14][1][correct]}`;document.getElementById('feedback').innerHTML=`<div class="answer"><strong class="${good?'good':'bad'}">${good?'✓ 答對了！ +10分':'✕ 答錯了，再記住這個重點！'}</strong><p>${safe(explanation)}</p></div>`;document.getElementById('nextslot').innerHTML=btn(step===19?'查看總成績':'下一題 →','next()');document.getElementById('score').textContent=`得分 ${score} / 200`}
function next(){step++;render()}function restart(){step=-1;score=0;render()}render();
</script></body></html>
